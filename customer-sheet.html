<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sheet - 30 Days (MongoDB)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .matrix-input {
            width: 55px;
            text-align: center;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .matrix-table th,
        .matrix-table td {
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        .day-col {
            min-width: 65px;
            width: 65px;
        }

        .total-column-bg {
            background-color: #212529 !important;
            color: #ffffff !important;
            font-weight: bold;
            width: 110px;
            min-width: 110px;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .sticky-footer {
            position: sticky;
            bottom: 0;
            background-color: #f8f9fa;
            font-weight: bold;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-warning shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold text-dark">👥 30-Day Customer Supplies Matrix (MongoDB
                Cloud)</span>
            <a href="dashboard.html" class="btn btn-dark btn-sm fw-bold">Dashboard Back</a>
        </div>
    </nav>
    <div class="container-fluid px-4 mb-5">
        <div class="card p-4 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0">Customers Bottles Supply Log (Day 1 to 30)</h5>
                <button onclick="addNewCustomer()" class="btn btn-success fw-bold">+ Add New Customer</button>
            </div>

            <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                <table class="table table-bordered matrix-table bg-white m-0">
                    <thead class="table-dark sticky-top">
                        <tr id="headerRow">
                            <th style="min-width:180px; text-align: left;">Customer Name</th>
                            <!-- JS Dynamic Day Headers -->
                            <th class="total-column-bg">TOTAL BOTTLES</th>
                            <th style="min-width: 50px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody"></tbody>
                    <tfoot class="sticky-footer" id="matrixFooter"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://vercel.app";

        if (!localStorage.getItem('loggedInUser')) { window.location.href = 'index.html'; }

        // Dynamic Header Injection
        const headerRow = document.getElementById('headerRow');
        const totalTh = headerRow.children[1];

        for (let d = 1; d <= 30; d++) {
            let th = document.createElement('th');
            th.innerText = 'D' + d;
            th.className = 'day-col';
            headerRow.insertBefore(th, totalTh);
        }

        let customersData = [];

        async function loadCustomers() {
            try {
const response = await fetch('/api/customers');
                customersData = await response.json();
                renderMatrix();
            } catch (err) {
                console.error("Error fetching customers from database:", err);
            }
        }

        function renderMatrix() {
            const tbody = document.getElementById('customerTableBody');
            if (customersData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="33" class="text-center text-muted py-4">Koi customer nahi hai. Add Customer button par click karein.</td></tr>`;
                document.getElementById('matrixFooter').innerHTML = '';
                return;
            }

            let html = '';
            customersData.forEach((cust, custIdx) => {
                let rowTotal = 0;
                let cellsHtml = '';

                for (let d = 0; d < 30; d++) {
                    let val = cust.days[d] || 0;
                    rowTotal += val;
                    cellsHtml += `<td>
                        <input type="number" class="matrix-input" 
                               value="${val || ''}" placeholder="0" min="0" 
                               onfocus="if(this.value=='0') this.value='';"
                               onchange="updateBottleCount('${cust._id}', ${custIdx}, ${d}, this.value)">
                    </td>`;
                }

                html += `<tr>
                    <td class="fw-bold text-start text-primary" style="min-width:180px;">${cust.name}</td>
                    ${cellsHtml}
                    <td id="total-cust-${custIdx}" class="fw-bold table-dark text-white fs-6">${rowTotal}</td>
                    <td><button class="btn btn-sm btn-outline-danger py-0" onclick="deleteCustomer('${cust._id}', '${cust.name}')">&times;</button></td>
                </tr>`;
            });
            tbody.innerHTML = html;
            renderColumnTotals();
        }

        async function addNewCustomer() {
            let name = prompt("Customer ka Naam Likhein:");
            if (name && name.trim() !== "") {
                try {
                    await fetch(`${API_BASE_URL}/customers/add`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name.trim() })
                    });
                    loadCustomers();
                } catch (err) { console.error("Error adding customer:", err); }
            }
        }

        async function updateBottleCount(dbId, custIdx, dayIdx, value) {
            const numVal = Number(value) || 0;
            customersData[custIdx].days[dayIdx] = numVal;

            // Fast interface update before network response ends
            let newRowTotal = customersData[custIdx].days.reduce((a, b) => a + b, 0);
            document.getElementById(`total-cust-${custIdx}`).innerText = newRowTotal;
            renderColumnTotals();

            try {
                await fetch(`${API_BASE_URL}/customers/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: dbId, dayIdx, value: numVal })
                });
            } catch (err) { console.error("Error updating bottle count:", err); }
        }

        function renderColumnTotals() {
            const footer = document.getElementById('matrixFooter');
            if (customersData.length === 0) return;

            let dayTotals = new Array(30).fill(0);
            let grandTotal = 0;

            customersData.forEach(cust => {
                for (let d = 0; d < 30; d++) {
                    let val = cust.days[d] || 0;
                    dayTotals[d] += val;
                    grandTotal += val;
                }
            });

            let footerHtml = `<tr class="table-secondary"><td class="text-start text-dark fw-bold">Daily Total:</td>`;
            dayTotals.forEach(sum => { footerHtml += `<td class="fw-bold text-dark">${sum}</td>`; });
            footerHtml += `<td class="bg-dark text-warning fw-bold fs-6">${grandTotal}</td><td></td></tr>`;

            footer.innerHTML = footerHtml;
        }

        async function deleteCustomer(dbId, name) {
            if (confirm(`Kya aap "${name}" ko list se nikalna chahte hain?`)) {
                try {
                    await fetch(`${API_BASE_URL}/customers/delete/${dbId}`, { method: 'DELETE' });
                    loadCustomers();
                } catch (err) { console.error("Error deleting customer:", err); }
            }
        }

        loadCustomers();
    </script>
</body>

</html>
