<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sheet - 30 Days (MongoDB)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <style>
        @media (max-width: 576px) {
            .matrix-table {
                border-collapse: separate !important;
                border-spacing: 0 !important;
            }

            /* 1. Header ke pehle cell (Customer Name) ka Sticky Framework */
            #headerRow th:first-child {
                position: sticky !important;
                left: 0 !important;
                background-color: #212529 !important;
                /* Uniform black layer */
                color: white !important;
                z-index: 999 !important;
                width: 110px !important;
                min-width: 110px !important;
                max-width: 110px !important;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2) !important;
            }

            /* 2. Body ke pehle cell (Actual Names) ka Sticky Framework */
            #customerTableBody tr td:first-child {
                position: sticky !important;
                left: 0 !important;
                background-color: #212529 !important;
                /* Uniform text contrast layout matching image */
                color: #ffffff !important;
                font-weight: bold !important;
                z-index: 99 !important;
                width: 110px !important;
                min-width: 110px !important;
                max-width: 110px !important;
                font-size: 12px !important;
                text-align: left !important;
                padding-left: 8px !important;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2) !important;
            }

            /* 3. Footer (Daily Total:) ke pehle cell ka Sticky Framework */
            #matrixFooter tr td:first-child {
                position: sticky !important;
                left: 0 !important;
                background-color: #ffffff !important;
                color: #212529 !important;
                font-weight: bold !important;
                z-index: 99 !important;
                width: 110px !important;
                min-width: 110px !important;
                max-width: 110px !important;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.15) !important;
            }

            /* 📌 300px - 500px Mobile View Screen Compressions */

            .container.py-4 {
                padding-left: 4px !important;
                padding-right: 4px !important;
            }

            .card {
                padding: 8px !important;
            }

            h3 {
                font-size: 16px !important;
                text-align: center !important;
            }

            /* Slider text and navigation scaling */
            .bg-secondary {
                padding: 4px 8px !important;
                gap: 6px !important;
            }

            .bg-secondary span {
                font-size: 12px !important;
                min-width: 100px !important;
            }

            .bg-secondary button {
                padding: 2px 6px !important;
                font-size: 12px !important;
            }

            /* Input element dimensions inside cells */
            .matrix-input {
                width: 45px !important;
                padding: 2px !important;
                font-size: 12px !important;
            }
        }


        /* 📌 Customer Name (Pehla Column) Exact Sticky Configuration */
        #customerTableBody td:first-child,
        .table-responsive table tbody tr td:first-child,
        #headerRow th:first-child {
            position: sticky !important;
            left: 0 !important;
            background-color: #212529 !important;
            /* Header layer font color black */
            color: white !important;
            z-index: 99 !important;
            box-shadow: 3px 0 5px rgba(0, 0, 0, 0.2);
        }

        /* Body row fields cells mapping styling */
        .table-responsive table tbody tr td:first-child {
            background-color: #ffffff !important;
            color: #0d6efd !important;
            font-weight: bold !important;
        }

        /* Row hover logic tracking overlay */
        .table-responsive table tbody tr:hover td:first-child {
            background-color: #f1f3f5 !important;
        }

        /* Container limits to activate scrolling triggers */
        .table-responsive {
            overflow-x: auto !important;
            max-width: 100%;
        }
    </style>

</head>

<body class="bg-light">
    <!-- ✅ Line 97 se 108 ki jagah yeh single-line responsive navbar lagayein: -->
    <nav class="navbar navbar-expand-lg shadow-sm bg-primary py-2">
        <div class="container d-flex justify-content-between align-items-center flex-nowrap px-2">
            <span class="navbar-brand fw-bold text-white text-wrap m-0"
                style="font-size: 14px; max-width: 50%; line-height: 1.2;">
                Monthly Customer Supplies Sheet
            </span>
            <div class="d-flex align-items-center gap-1">
                <a href="dashboard.html" class="btn btn-danger btn-sm fw-bold px-2 py-1"
                    style="font-size: 11px; white-space: nowrap;">Dashboard Back</a>
                <button onclick="logout()" class="btn btn-danger btn-sm fw-bold px-2 py-1"
                    style="font-size: 11px; white-space: nowrap;">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-4  ">
        <div class="card p-2 p-md-4 shadow-sm border-0">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h3 class="fw-bold m-0">30 Days Customers Entry Sheet</h3>
                <div class="d-flex align-items-center gap-3 bg-secondary px-3 py-1 rounded shadow-sm">
                    <button class="btn btn-sm btn-light fw-bold py-0" onclick="navigateCustomerMonth(-1)">&lt;</button>
                    <span id="customerMonthHeading" class="text-white fw-bold font-monospace"
                        style="min-width: 140px; text-align: center; display: inline-block;">-</span>
                    <button class="btn btn-sm btn-light fw-bold py-0" onclick="navigateCustomerMonth(1)">&gt;</button>
                </div>

                <button onclick="addNewCustomer()" class="btn btn-success fw-bold">+ Add New Customer</button>
            </div>


            <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                <table class="table table-bordered matrix-table bg-white m-0">
                    <thead class="table-dark sticky-top">
                        <tr id="headerRow">
                            <th style="min-width:180px; text-align: left;">Customer Name</th>
                            <!-- JS Dynamic Day Headers -->
                            <th class="total-column-bg">TOTAL BOTTLES</th>
                            <th style="min-width: 50px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody"></tbody>
                    <tfoot class="sticky-footer" id="matrixFooter"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "/api";

        if (!localStorage.getItem('loggedInUser')) { window.location.href = 'index.html'; }

        // Dynamic Header Injection
        const headerRow = document.getElementById('headerRow');
        const totalTh = headerRow.children[1];

        for (let d = 1; d <= 30; d++) {
            let th = document.createElement('th');
            th.innerText = 'D' + d;
            th.className = 'day-col';
            headerRow.insertBefore(th, totalTh);
        }

        // Global Date State for Customer Sheet
        let customerTrackingDate = new Date();

        function updateCustomerMonthDisplay() {
            const options = { month: 'long', year: 'numeric' };
            const formattedMonth = customerTrackingDate.toLocaleDateString('default', options);

            const headingElem = document.getElementById("customerMonthHeading");
            if (headingElem) {
                headingElem.innerText = formattedMonth;
            }
            loadCustomers(); // Mahina badalne par data dobara fetch karega
        }

        function navigateCustomerMonth(direction) {
            customerTrackingDate.setMonth(customerTrackingDate.getMonth() + direction);
            updateCustomerMonthDisplay();
        }




        let customersData = [];

        async function loadCustomers() {
            try {
                // Format: YYYY-MM (e.g., "2026-10")
                const year = customerTrackingDate.getFullYear();
                const monthStr = String(customerTrackingDate.getMonth() + 1).padStart(2, '0');
                const targetMonth = `${year}-${monthStr}`;

                // 🔴 Main API URL dynamic fetch month parameter ke sath
                const response = await fetch(`${API_BASE_URL}/customers?month=${targetMonth}`);
                if (!response.ok) throw new Error('Server returned an error');

                const data = await response.json();

                if (Array.isArray(data)) {
                    customersData = data;
                    renderMatrix();
                } else {
                    console.error("Data array nahi hai:", data);
                    customersData = [];
                    renderMatrix();
                }
            } catch (err) {
                console.error("Error fetching customers from database:", err);
                customersData = [];
                renderMatrix();
            }
        }



        function renderMatrix() {
            const tbody = document.getElementById('customerTableBody');
            if (customersData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="33" class="text-center text-muted py-4">Koi customer nahi hai. Add Customer button par click karein.</td></tr>`;
                document.getElementById('matrixFooter').innerHTML = '';
                return;
            }

            let html = '';
            customersData.forEach((cust, custIdx) => {
                let rowTotal = 0;
                let cellsHtml = '';

                for (let d = 1; d <= 30; d++) {
                    // Safe key value lookup handle for Mongoose maps vs json objects
                    let val = 0;
                    if (cust.days) {
                        val = typeof cust.days.get === 'function' ? (cust.days.get(String(d)) || 0) : (cust.days[d] || 0);
                    }
                    rowTotal += Number(val) || 0;

                    cellsHtml += `<td>
            <input type="number" class="matrix-input text-center" 
                   value="${val || 0}" min="0"
                   onfocus="if(this.value=='0') this.value=''"
                   onchange="updateBottleCount('${cust._id}', ${custIdx}, ${d}, this.value)">
        </td>`;
                }

                html += `<tr>
                    <td class="fw-bold text-start text-primary" style="min-width:180px;">${cust.name}</td>
                    ${cellsHtml}
                    <td id="total-cust-${custIdx}" class="fw-bold table-dark text-white fs-6">${rowTotal}</td>
                    <td><button class="btn btn-sm btn-outline-danger py-0" onclick="deleteCustomer('${cust._id}', '${cust.name}')">&times;</button></td>
                </tr>`;
            });
            tbody.innerHTML = html;
            renderColumnTotals();
        }

        async function addNewCustomer() {
            const name = prompt("Customer ka naam likhein:");
            if (!name || !name.trim()) return;

            // Current slider date se month param nikalna (e.g., "2026-10")
            const year = customerTrackingDate.getFullYear();
            const monthStr = String(customerTrackingDate.getMonth() + 1).padStart(2, '0');
            const targetMonth = `${year}-${monthStr}`;

            try {
                const response = await fetch(`${API_BASE_URL}/customers/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name.trim(), month: targetMonth }) // 👈 Month bhej rahe hain
                });

                if (response.ok) {
                    loadCustomers(); // Data reload refresh call
                } else {
                    alert("Customer add karne me koi masla aaya!");
                }
            } catch (err) {
                console.error("Error adding customer:", err);
            }
        }


        // ✅ Line 192 ke paas updateBottleCount function ko is se replace karein:
        async function updateBottleCount(dbid, custIdx, dayIdx, value) {
            const numVal = Number(value) || 0;

            // Local data structure state safe update
            if (!customersData[custIdx].days) {
                customersData[custIdx].days = {};
            }

            // Map/Object properties setting rule
            if (typeof customersData[custIdx].days.set === 'function') {
                customersData[custIdx].days.set(String(dayIdx), numVal);
            } else {
                customersData[custIdx].days[dayIdx] = numVal;
            }

            // 🔴 CRITICAL TOTALS FIX: .reduce() hata kar Object.values() se total nikalna
            let newRowTotal = 0;
            const daysObj = customersData[custIdx].days;

            if (daysObj) {
                // Agar days Mongoose Map hai ya normal Object, dono surton me safe calculation:
                const valuesArray = typeof daysObj.values === 'function' ? Array.from(daysObj.values()) : Object.values(daysObj);
                valuesArray.forEach(v => { newRowTotal += (Number(v) || 0); });
            }

            // Live display label interface updates without lag
            const totalLabel = document.getElementById(`total-cust-${dbid}`);
            if (totalLabel) totalLabel.innerText = newRowTotal;

            // Bottom columns total trigger
            renderColumnTotals();

            try {
                await fetch(`${API_BASE_URL}/customers/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: dbid, dayIdx, value: numVal })
                });
            } catch (err) {
                console.error("Error updating bottle count in cloud:", err);
            }
        }



        function renderColumnTotals() {
            const footer = document.getElementById('matrixFooter');
            if (!footer || customersData.length === 0) return;

            let dayTotals = Array(31).fill(0);
            let grandTotal = 0;

            customersData.forEach(cust => {
                for (let d = 1; d <= 30; d++) {
                    let val = 0;
                    if (cust.days) {
                        val = typeof cust.days.get === 'function' ? (cust.days.get(String(d)) || 0) : (cust.days[d] || 0);
                    }
                    dayTotals[d] += Number(val) || 0;
                    grandTotal += Number(val) || 0;
                }
            });

            let footerHtml = `<tr class="table-secondary"><td class="fw-bold text-center">Daily Total:</td>`;
            for (let d = 1; d <= 30; d++) {
                footerHtml += `<td class="text-center fw-bold">${dayTotals[d]}</td>`;
            }
            footerHtml += `<td class="bg-dark text-warning fw-bold text-center fs-6">${grandTotal}</td></tr>`;

            footer.innerHTML = footerHtml;
        }


        async function deleteCustomer(dbId, name) {
            if (confirm(`Kya aap "${name}" ko list se nikalna chahte hain?`)) {
                try {
                    await fetch(`${API_BASE_URL}/customers/delete/${dbId}`, { method: 'DELETE' });
                    loadCustomers();
                } catch (err) { console.error("Error deleting customer:", err); }
            }
        }

        updateCustomerMonthDisplay();
    </script>
</body>

</html>
