<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Water Supply Portal</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background: #fff;
        }
    </style>
</head>

<body>
    <div class="login-card text-center">
        <h3 class="mb-2 text-primary fw-bold">Water Supply</h3>
        <p class="text-muted mb-4">Authorized Access Only</p>
        <div id="loginAlert" class="alert alert-danger d-none"></div>
        <form id="loginForm" class="text-start">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username (HAMZA / AYAN)</label>
                <input type="text" id="username" class="form-control form-control-lg" placeholder="Enter Name" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" id="password" class="form-control form-control-lg" placeholder="Enter Password"
                    required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 py-2 fw-bold">Sign In</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim().toUpperCase();
            const pass = document.getElementById('password').value;
            const alertBox = document.getElementById('loginAlert');

            if ((user === 'HAMZA' && pass === 'hamza123') || (user === 'AYAN' && pass === 'ayan123')) {
                localStorage.setItem('loggedInUser', user);
                window.location.href = 'dashboard.html';
            } else {
                alertBox.classList.remove('d-none');
                alertBox.innerText = 'Ghalat details! Sirf HAMZA aur AYAN allowed hain.';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>

</html>
